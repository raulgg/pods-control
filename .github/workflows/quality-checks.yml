name: Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - stacked

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stacked PRs run this workflow on every layer as if it targeted main.
  # Skip the macOS job on mid-stack layers; remaining bottom and top still
  # run. A skipped job reports Success for required checks.
  gate:
    name: Stack CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-run: ${{ steps.gate.outputs.should-run }}
    steps:
      - name: Stack CI Gate
        id: gate
        uses: raulgg/stack-ci-gate@0aa56dbd636b767845e572fefe8a8a487b524879 # v1.1.0

  formatting:
    name: Check formatting
    needs: gate
    if: needs.gate.outputs.should-run == 'true'
    runs-on: macos-15
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install formatters
        uses: ./.github/actions/setup-mise
        with:
          install_args: swiftformat rumdl

      - name: Check formatting
        env:
          RUMDL_OUTPUT_FORMAT: github
        run: |
          swiftformat --version
          rumdl --version
          mise run format-check

      - name: Check Swift lint
        run: mise run swift-lint

  scripts:
    name: Check scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run script tests
        run: |
          set -eu
          for t in scripts/test/*.sh; do
            "$t"
          done
