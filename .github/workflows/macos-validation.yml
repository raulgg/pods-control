name: macOS validation

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - stacked

permissions:
  contents: read

concurrency:
  group: macos-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stacked PRs run this workflow on every layer as if it targeted main.
  # Skip the macOS jobs on mid-stack layers; remaining bottom and top still
  # run. A skipped job reports Success for required checks.
  gate:
    name: Stack CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-run: ${{ steps.gate.outputs.should-run }}
    steps:
      - name: Stack CI Gate
        id: gate
        uses: raulgg/stack-ci-gate@0aa56dbd636b767845e572fefe8a8a487b524879 # v1.1.0

  build:
    name: Build, test, and verify install
    needs: gate
    if: needs.gate.outputs.should-run == 'true'
    # Swift Testing needs Swift 6 from this runner's default toolchain.
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift_version=$(swift --version)
          printf '%s\n' "$swift_version"
          swift_major=$(printf '%s\n' "$swift_version" |
            sed -nE 's/.*Swift version ([0-9]+)\..*/\1/p')
          if ! [ "${swift_major:-0}" -ge 6 ]; then
            echo '::error::Swift 6 or newer is required to run Swift Testing.'
            exit 1
          fi
          swiftc --version
          clang --version

      - name: Build
        run: |
          make
          lipo build/pods-control -verify_arch arm64 x86_64
          lipo build/avbypass.dylib -verify_arch arm64 x86_64
          codesign --verify --verbose build/pods-control
          codesign --verify --verbose build/avbypass.dylib

      - name: Smoke test (read-only)
        run: |
          # Parser tests never access the device or load the bypass dylib.
          make test

      - name: Verify DYLD interpose runtime
        run: make verify-runtime

      - name: Verify install layout
        run: |
          stage="$RUNNER_TEMP/airpods-control-install"
          expected_version=$(cat version.txt)
          new_target="../libexec/pods-control/pods-control"

          mkdir -p "$stage/usr/local/bin"
          printf 'foreign-command\n' >"$stage/usr/local/bin/pods-control"
          if DESTDIR="$stage" PREFIX=/usr/local make install >/dev/null 2>&1; then
            echo "make install replaced a command it does not own" >&2
            exit 1
          fi
          test "$(cat "$stage/usr/local/bin/pods-control")" = foreign-command
          test ! -e "$stage/usr/local/libexec/pods-control/pods-control"
          rm -f "$stage/usr/local/bin/pods-control"

          printf 'foreign-command\n' >"$stage/usr/local/bin/airpods-control"
          if DESTDIR="$stage" PREFIX=/usr/local make install >/dev/null 2>&1; then
            echo "make install replaced a legacy command it does not own" >&2
            exit 1
          fi
          test "$(cat "$stage/usr/local/bin/airpods-control")" = foreign-command
          test ! -e "$stage/usr/local/libexec/pods-control/pods-control"
          rm -f "$stage/usr/local/bin/airpods-control"

          DESTDIR="$stage" PREFIX=/usr/local make install
          test "$(readlink "$stage/usr/local/bin/pods-control")" = "$new_target"
          test "$(readlink "$stage/usr/local/bin/airpods-control")" = \
            "$new_target"
          test -x "$stage/usr/local/libexec/pods-control/pods-control"
          test ! -e "$stage/usr/local/libexec/airpods-control"
          test -f "$stage/usr/local/share/man/man1/pods-control.1"
          test -f "$stage/usr/local/share/man/man1/airpods-control.1"
          test "$("$stage/usr/local/bin/pods-control" --version)" = \
            "$expected_version"
          test "$("$stage/usr/local/bin/airpods-control" --version)" = \
            "$expected_version"
          "$stage/usr/local/bin/airpods-control" --version >/dev/null \
            2>"$stage/compat.err"
          test ! -s "$stage/compat.err"

          legacy="$RUNNER_TEMP/airpods-control-legacy"
          mkdir -p "$legacy/usr/local/bin" \
            "$legacy/usr/local/libexec/airpods-control"
          printf '%s\n' '#!/bin/sh' "printf '%s\\n' legacy" \
            >"$legacy/usr/local/libexec/airpods-control/airpods-control"
          chmod +x "$legacy/usr/local/libexec/airpods-control/airpods-control"
          ln -s ../libexec/airpods-control/airpods-control \
            "$legacy/usr/local/bin/airpods-control"
          DESTDIR="$legacy" PREFIX=/usr/local make install
          test "$(readlink "$legacy/usr/local/bin/pods-control")" = \
            "$new_target"
          test "$(readlink "$legacy/usr/local/bin/airpods-control")" = \
            "$new_target"
          test ! -e "$legacy/usr/local/libexec/airpods-control"
          test "$("$legacy/usr/local/bin/pods-control" --version)" = \
            "$expected_version"

          rm -f "$stage/usr/local/bin/pods-control"
          printf 'foreign-command\n' >"$stage/usr/local/bin/pods-control"
          if DESTDIR="$stage" PREFIX=/usr/local make uninstall >/dev/null 2>&1; then
            echo "make uninstall removed a command it does not own" >&2
            exit 1
          fi
          test "$(cat "$stage/usr/local/bin/pods-control")" = foreign-command
          test -e "$stage/usr/local/libexec/pods-control/pods-control"
          test -L "$stage/usr/local/bin/airpods-control"
          rm -f "$stage/usr/local/bin/pods-control"
          ln -s "$new_target" "$stage/usr/local/bin/pods-control"

          rm -f "$stage/usr/local/bin/airpods-control"
          printf 'foreign-command\n' >"$stage/usr/local/bin/airpods-control"
          if DESTDIR="$stage" PREFIX=/usr/local make uninstall >/dev/null 2>&1; then
            echo "make uninstall removed a legacy command it does not own" >&2
            exit 1
          fi
          test "$(cat "$stage/usr/local/bin/airpods-control")" = foreign-command
          test -e "$stage/usr/local/libexec/pods-control/pods-control"
          test -L "$stage/usr/local/bin/pods-control"
          rm -f "$stage/usr/local/bin/airpods-control"
          ln -s "$new_target" "$stage/usr/local/bin/airpods-control"

          DESTDIR="$stage" PREFIX=/usr/local make uninstall
          test ! -e "$stage/usr/local/bin/pods-control"
          test ! -e "$stage/usr/local/bin/airpods-control"
          test ! -e "$stage/usr/local/libexec/pods-control"
          test ! -e "$stage/usr/local/libexec/airpods-control"
          test ! -e "$stage/usr/local/share/man/man1/pods-control.1"
          test ! -e "$stage/usr/local/share/man/man1/airpods-control.1"

  runtime-needed:
    name: Decide runtime jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.decide.outputs.needed }}

    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "needed=true" >>"$GITHUB_OUTPUT"
            echo "Running runtime jobs (not a pull request)"
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "$BASE_SHA"
          fi
          classifier=scripts/runtime-ci-needed.sh
          diff_names() {
            git -c core.quotePath=false diff --name-only --no-renames \
              "$BASE_SHA" "$HEAD_SHA"
          }
          if ! git cat-file -e "$BASE_SHA:$classifier" 2>/dev/null; then
            echo "needed=true" >>"$GITHUB_OUTPUT"
            echo "No classifier at $BASE_SHA; running runtime jobs"
            diff_names
            exit 0
          fi
          base_file="$RUNNER_TEMP/runtime-ci-needed.base.sh"
          git show "$BASE_SHA:$classifier" >"$base_file"
          needed=$(diff_names | sh "$base_file")
          case "$needed" in
            true|false) ;;
            *)
              echo "error: base classifier printed '$needed'" >&2
              exit 1
              ;;
          esac
          echo "needed=$needed" >>"$GITHUB_OUTPUT"
          echo "Runtime jobs needed: $needed"
          diff_names

  macos-26:
    name: Runtime (macOS 26)
    needs:
      - gate
      - runtime-needed
    if: >-
      needs.gate.outputs.should-run == 'true' &&
      needs.runtime-needed.result == 'success' &&
      needs.runtime-needed.outputs.needed == 'true'
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show toolchain
        run: |
          swiftc --version
          clang --version
          uname -m

      - name: Build
        run: |
          host_arch=$(uname -m)
          make ARCHS="$host_arch"
          lipo build/pods-control -verify_arch "$host_arch"
          lipo build/avbypass.dylib -verify_arch "$host_arch"
          codesign --verify --verbose build/pods-control
          codesign --verify --verbose build/avbypass.dylib

      - name: Verify DYLD interpose runtime
        run: make verify-runtime

      - name: Verify install layout
        run: |
          stage="$RUNNER_TEMP/airpods-control-install"
          expected_version=$(cat version.txt)
          new_target="../libexec/pods-control/pods-control"
          DESTDIR="$stage" PREFIX=/usr/local make install
          test "$(readlink "$stage/usr/local/bin/pods-control")" = \
            "$new_target"
          test "$(readlink "$stage/usr/local/bin/airpods-control")" = \
            "$new_target"
          test ! -e "$stage/usr/local/libexec/airpods-control"
          test "$("$stage/usr/local/bin/pods-control" --version)" = \
            "$expected_version"

  macos-26-gate:
    name: Build, test, and verify runtime (macOS 26)
    needs:
      - gate
      - runtime-needed
      - macos-26
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Reflect macOS 26 runtime
        env:
          SHOULD_RUN: ${{ needs.gate.outputs.should-run }}
          DECIDE: ${{ needs.runtime-needed.result }}
          NEEDED: ${{ needs.runtime-needed.outputs.needed }}
          RESULT: ${{ needs.macos-26.result }}
        run: |
          if [ "$SHOULD_RUN" != "true" ]; then
            echo "Skipping macOS 26 runtime; mid-stack layer."
            exit 0
          fi
          if [ "$DECIDE" != "success" ]; then
            echo "runtime-needed job result: $DECIDE"
            exit 1
          fi
          if [ "$NEEDED" = "false" ]; then
            echo "Skipping macOS 26 runtime; the diff does not affect the binary or interpose."
            exit 0
          fi
          if [ "$NEEDED" != "true" ]; then
            echo "runtime-needed output needed is not true or false: '$NEEDED'"
            exit 1
          fi
          if [ "$RESULT" != "success" ]; then
            echo "macOS 26 runtime job result: $RESULT"
            exit 1
          fi

  intel:
    name: Runtime (Intel)
    needs:
      - gate
      - runtime-needed
    if: >-
      needs.gate.outputs.should-run == 'true' &&
      needs.runtime-needed.result == 'success' &&
      needs.runtime-needed.outputs.needed == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show toolchain
        run: |
          swiftc --version
          clang --version
          uname -m

      - name: Build
        run: |
          host_arch=$(uname -m)
          make ARCHS="$host_arch"
          lipo build/pods-control -verify_arch "$host_arch"
          lipo build/avbypass.dylib -verify_arch "$host_arch"
          codesign --verify --verbose build/pods-control
          codesign --verify --verbose build/avbypass.dylib

      - name: Verify DYLD interpose runtime
        run: make verify-runtime

      - name: Verify install layout
        run: |
          stage="$RUNNER_TEMP/airpods-control-install"
          expected_version=$(cat version.txt)
          new_target="../libexec/pods-control/pods-control"
          DESTDIR="$stage" PREFIX=/usr/local make install
          test "$(readlink "$stage/usr/local/bin/pods-control")" = \
            "$new_target"
          test "$(readlink "$stage/usr/local/bin/airpods-control")" = \
            "$new_target"
          test ! -e "$stage/usr/local/libexec/airpods-control"
          test "$("$stage/usr/local/bin/pods-control" --version)" = \
            "$expected_version"

  intel-gate:
    name: Build, test, and verify runtime (Intel)
    needs:
      - gate
      - runtime-needed
      - intel
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Reflect Intel runtime
        env:
          SHOULD_RUN: ${{ needs.gate.outputs.should-run }}
          DECIDE: ${{ needs.runtime-needed.result }}
          NEEDED: ${{ needs.runtime-needed.outputs.needed }}
          RESULT: ${{ needs.intel.result }}
        run: |
          if [ "$SHOULD_RUN" != "true" ]; then
            echo "Skipping Intel runtime; mid-stack layer."
            exit 0
          fi
          if [ "$DECIDE" != "success" ]; then
            echo "runtime-needed job result: $DECIDE"
            exit 1
          fi
          if [ "$NEEDED" = "false" ]; then
            echo "Skipping Intel runtime; the diff does not affect the binary or interpose."
            exit 0
          fi
          if [ "$NEEDED" != "true" ]; then
            echo "runtime-needed output needed is not true or false: '$NEEDED'"
            exit 1
          fi
          if [ "$RESULT" != "success" ]; then
            echo "Intel runtime job result: $RESULT"
            exit 1
          fi
