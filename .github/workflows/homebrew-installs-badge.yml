name: Homebrew install badge

on:
  # GitHub disables scheduled workflows after about 60 days without
  # repository activity. The badge then freezes at its last published value
  # until the next push or a manual workflow_dispatch run re-enables it.
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/scripts/homebrew-installs-badge.sh
      - .github/workflows/homebrew-installs-badge.yml

permissions:
  contents: write

concurrency:
  group: homebrew-installs-badge
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Shields endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A failed fetch keeps the last published badge instead of failing
      # the job; the build and publish steps are skipped below.
      - name: Fetch Homebrew analytics
        id: fetch
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 --retry-all-errors --max-time 60 \
            -A "pods-control-homebrew-badge (+https://github.com/raulgg/pods-control)" \
            -o "$RUNNER_TEMP/install-90d.json" \
            https://formulae.brew.sh/api/analytics/install/90d.json

      - name: Report skipped update
        if: steps.fetch.outcome != 'success'
        run: echo "::warning::Homebrew analytics fetch failed; keeping the last published badge"

      - name: Build endpoint JSON
        if: steps.fetch.outcome == 'success'
        run: |
          ./.github/scripts/homebrew-installs-badge.sh \
            --analytics-file "$RUNNER_TEMP/install-90d.json" \
            --output "$RUNNER_TEMP/homebrew-installs.json"
          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' \
            "$RUNNER_TEMP/homebrew-installs.json"

      # Fails loudly if the badges branch does not exist. Credentials stay
      # enabled so the publish step can push.
      - name: Checkout badges branch
        if: steps.fetch.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: badges
          path: badges

      - name: Publish to badges branch
        if: steps.fetch.outcome == 'success'
        working-directory: badges
        run: |
          set -eu
          cp "$RUNNER_TEMP/homebrew-installs.json" homebrew-installs.json
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add homebrew-installs.json
          if git diff --cached --quiet; then
            echo "badge data unchanged"
            exit 0
          fi
          git commit -m "chore: update Homebrew install badge"
          git push origin badges
